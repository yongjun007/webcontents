<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>설문지</title>
        <style>
            body {
                background-color: aliceblue;
            }

            h1 {
                color: brown;
                width: 100%;
                text-align: center;
            }

            p,
            form {
                font-size: 1em;
                text-indent: 1em;
                font-family: 'Nanum Pen Script', cursive;
            }

            .틀 {
                border-top: 1px solid black;
            }

            .설문지 {
                margin: 0 auto;
                width: 90%;
                width: 1000px;
                background-color: pink;
            }

            footer {
                background-color: orange;
                border-radius: 10px;
                margin-top: 20px;
                width: 1000px;
                margin: 0 auto;
            }
        </style>
    </head>

    <body>
        <h1>설문지</h1>
        <p>소프트웨어 기술에 대한 의견을 듣습니다. 많은 참여 부탁드립니다.</p>
        <hr>
        <div class="틀">
            <div class="설문지">
                <form>
                    학년:
                    <label><input type="radio" name="학년" value="1"> 1학년</label>
                    <label><input type="radio" name="학년" value="2"> 2학년</label>
                    <label><input type="radio" name="학년" value="3"> 3학년</label>
                    <br><br>
                    성별
                    <label><input type="radio" name="성별" value="man"> 남</label>
                    <label><input type="radio" name="성별" value="woman"> 여</label>
                    <br><br>
                    관심 분야
                    <select name="관심분야">
                        <option value="1">모바일 소프트웨어</option>
                        <option value="2">모바일 소프트웨어2</option>
                        <option value="3">모바일 소프트웨어3</option>
                    </select>
                    <br><br>
                    진로
                    <label><input type="checkbox" name="진로" value="개발"> 개발</label>
                    <label><input type="checkbox" name="진로" value="기획"> 기획</label>
                    <label><input type="checkbox" name="진로" value="영업"> 영업</label>
                    <label><input type="checkbox" name="진로" value="창업"> 창업</label>
                    <br><br>
                    남기고 싶은 말
                    <textarea rows="10" cols="40" placeholder="글을 남겨주세요"></textarea>
                </form>
            </div>
        </div>
        <footer>
            <p>Copyright 2026 by MYONGJI COLLEGE</p>
        </footer>
    </body>
</html>
